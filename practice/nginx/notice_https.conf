# 社内のお知らせサイト（ハンズオン7 の形: HTTPS と、HTTP から HTTPS への転送）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name notice.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name notice.example.test;
    ssl_certificate     /etc/pki/tls/certs/notice.crt;
    ssl_certificate_key /etc/pki/tls/private/notice.key;
    root /srv/notice/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
